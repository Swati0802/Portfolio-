            }
            .navbar ul ul{
                display: none;

                top:100%;
                left: 10%;
                min-width: 180px;
                flex-direction: column;
            }
            .navbar ul ul li{
                width: 100%;
            }
            .navbar ul li:hover ul{
                display:inline-flex;
            }
            .navbar ul ul ul{
                left: 180px;
                top:2px;
            }
            .navbar ul ul ul a{

            }
