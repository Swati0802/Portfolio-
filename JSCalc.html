<html>
    <head>

    </head>
    <body>
        <script>
            var x = prompt("Enter the value of X : ");
            var y  = prompt("Enter the value of Y : ");

            x= Number(x);
            y= Number(y);

            document.write("Value of X : "+ x +"<br><br>");
            document.write("Value of Y : "+ y +"<br><br>");

            document.write("ADDITION : "+ "<br>");
            var c=x+y;
            document.write("X + Y : "+ c +"<br><br>");

            document.write("SUBTRACTION : "+ "<br>")
            var c=x-y;
            document.write("X - Y : "+ c +"<br><br>");

            document.write("MULTIPLICATION : "+ "<br>");
            var c=x*y;
            document.write("X * Y : "+ c +"<br><br>");

            document.write("DIVISIPON : "+"<br>");
            var c=x/y;
            document.write("X / Y : "+ c +"<br><br>");

            document.write("MODULUS (Division Remainder) : "+ "<br>");
            var c=x%y;
            document.write("X % Y : "+ c + "<br><br>");

        </script>
    </body>
</html>
